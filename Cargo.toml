[workspace]
resolver = "2"
members = [
    "crates/chops-search-core",
    "crates/chops-search-cli",
    "crates/chops-search-wasm", "xtask",
]

# Size discipline for the wasm blob. The CLI also inherits this; if build
# times or CLI throughput ever matter, add a per-package override.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# panic = "abort" breaks `cargo test --release`; tests run in dev profile.
