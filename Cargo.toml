[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gitbadger-clan/chops-search"
authors = ["Artur Daschevici"]
# Cargo won't publish without this; pick the oldest you actually test on.
rust-version = "1.85"

[workspace]
resolver = "2"
members = [
    "crates/chops-search-core",
    "crates/chops-search-cli",
    "crates/chops-search-wasm", "xtask",
]

# Size discipline for the wasm blob. The CLI also inherits this; if build
# times or CLI throughput ever matter, add a per-package override.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# panic = "abort" breaks `cargo test --release`; tests run in dev profile.
