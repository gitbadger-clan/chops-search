[workspace.package]
version = "0.2.18"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gitbadger-clan/chops-search"
authors = ["Artur Daschevici"]
# Cargo won't publish without this; pick the oldest you actually test on.
rust-version = "1.97"

[workspace]
resolver = "2"
members = [
    "crates/chops-search-core",
    "crates/chops-search",
    "crates/chops-search-wasm",
    "xtask",
]
[workspace.dependencies]
# Internal. `version` is what the published crate resolves against; `path`
# is what local builds use. Both are required to publish, and living here
# means `cargo xtask version` updates every consumer at once.
chops-search-core = { path = "crates/chops-search-core", version = "0.2.18" }
# Size discipline for the wasm blob. The CLI also inherits this; if build
# times or CLI throughput ever matter, add a per-package override.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# panic = "abort" breaks `cargo test --release`; tests run in dev profile.
# The override that comment anticipated. `opt-level = "z"` is right for
# the wasm blob shipping to browsers and wrong for a native binary doing
# an eigendecomposition: nalgebra's PCA is the slowest part of `build`,
# and it runs on every content change.
[profile.release.package.chops-search]
opt-level = 3

[profile.release.package.nalgebra]
opt-level = 3

[profile.release.package.safetensors]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3
