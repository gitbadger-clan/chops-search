# Known-failing cases for the chops-search docs corpus. NOT part of the CI
# gate. Each case reproduces an open engine issue or an aspirational
# capability; run with:
#
#   chops-search eval --queries fixtures/known-failures.toml
#
# When a fix lands, verify its case passes at default scoring and move it
# back into fixtures/queries.toml in the same PR. These cases are the
# acceptance tests for the issues they cite; do not "fix" them by blessing
# the current noise winners in `expect`.
#
# Every case records what wins instead, as of the date noted. A case that
# starts failing for a NEW reason is a different bug wearing the same red
# text, and without the winner written down there is no way to see that.
#
# Promoted out on 2026-08-08 (fixed, now gating in queries.toml):
# "data-chops-open" (compound tokenization), "getting started" and "cli"
# (title weight vs length normalisation, fixed by BM25F), "shrink vectors
# to save bandwidth", "toddler bedtime routine", "Content-Range".

[[query]]
q = "model2vec-rs"
# ISSUE: RRF corroboration penalty, not orderable by any current knob.
# Keyword ranks it #1 at 7.563 against 2.451 for the winner; the
# semantic side scores it 0.274 against a 0.28 floor, so it contributes
# nothing to fusion and doc6 wins on 1/(60+2)+1/(60+1) versus 1/(60+1).
# Ruled out by measurement: field weights (no value moves it, sweep
# 2026-08-08), rrf_alpha (needs w > 62, unreachable; swept to 8),
# min_cos 0.26 (lets it into the list, still loses, and costs two
# negative controls). Fix would be score-level fusion rather than rank
# fusion.
expect = ["/explanations/one-tokenizer/"]
kind = "exact"

[[query]]
q = "bicycle chain lubricant"
# ISSUE: spurious resonance, a gate blindness that is inherent rather than
# pending. One document rings at a nonsense query and stands out from the
# pack, so top-minus-median reads it as signal by definition. Every
# min_gap value that catches it also suppresses legitimate semantic-only
# queries whose winner stands out; a statistic built to detect flat noise
# cannot detect pointed noise. Re-check only if the gate mechanism
# changes, or if a corpus edit removes the resonating chunk for its own
# reasons. Demoted from the gate 2026-08-19; it had never passed at any
# honest configuration (its green at --min-cos 0.34 was measurement debt).
# Wins 2026-08-19: /how-to/reindex-in-ci/ (expected: nothing).
expect = []
kind = "negative"

[[query]]
q = "what should i commit and what should i ignore"
# ISSUE: RRF ordering, probably the same one. Neither "commit" nor
# "ignore" appears on the winner, so the semantic side is ranking a page
# it should not and the keyword side fails to outvote it. Verify with
# `chops-search query` when weighted RRF lands: if the keyword list
# already had manage-the-model first, this comes along for free.
# Wins 2026-08-08: /explanations/designed-degradation/ (expected #2).
expect = ["/how-to/manage-the-model/", "/how-to/reindex-in-ci/", "/tutorials/getting-started/"]
kind = "paraphrase"

[[query]]
q = "make the download smaller for visitors"
# ISSUE: mention versus answer. getting-started says "about 30 MB, once"
# and "one-time 30 MB model download", so it is genuinely about a large
# download; it just never says how to shrink one. No available ranking
# signal separates a page that mentions a subject from one that answers
# about it. chunk_penalty is the nearest candidate and cannot reach: at
# 132 chunks over 19 docs the per-doc counts are too uniform for the
# sqrt(2 ln n) differential to matter (0.009 of cosine at coeff 0.02).
# Wins 2026-08-08: /tutorials/getting-started/ (expected #3).
expect = ["/how-to/manage-the-model/", "/explanations/range-fetched-model/"]
kind = "paraphrase"

[[query]]
q = "hide a page from the results"
# ISSUE: retrieval, not ordering. The expected page is not in the top 3 at
# all, so weighted RRF will not help. Every content word is corpus-common
# ("page", "results") except "hide", which appears nowhere in the corpus,
# so the keyword side has nothing discriminating and the semantic side
# matches a generic sentence against the page with a chunk near
# everything. Docs-side fix available: indexing-rules could state the
# intent in the reader's vocabulary ("keep a page out of search results"),
# a question it answers but never asks.
# Wins 2026-08-08: /tutorials/getting-started/.
expect = ["/reference/indexing-rules/"]
kind = "paraphrase"

[[query]]
q = "a page i wrote never shows up"
# ASPIRATIONAL: maximally colloquial symptom phrasing with almost no
# content words. Docs-side fix available too: indexing-rules could open
# with the symptom in the user's vocabulary. Near-duplicate of "hide a
# page from the results" above; if one is fixed by content the other
# probably follows, so treat them as one acceptance test in two registers.
expect = ["/reference/indexing-rules/", "/tutorials/evaluate-your-search/"]
kind = "paraphrase"

[[query]]
q = "stopped understanding meaning, only matches literal words now"
# ASPIRATIONAL: symptom-language paraphrase for keyword-only degradation.
# Docs-side fix available: designed-degradation could state the symptom
# as a visitor experiences it. Unverified since descriptions began being
# indexed into the keyword body field; re-run before citing it.
expect = ["/explanations/designed-degradation/", "/reference/browser-runtime/"]
kind = "paraphrase"

[[query]]
q = "rebuild automatically when i publish a post"
# ISSUE: sense collision. range-fetched-model says "a content rebuild
# touches index.bin", using the query's most distinctive word in the
# cache-invalidation sense rather than the CI sense, and BM25 cannot tell
# senses apart. The correct page is titled "Reindex on every push" and
# shares almost no vocabulary with the query: reindex/push/workflow
# against rebuild/publish/post. Engine-side this wants synonyms or query
# expansion, which is a far larger project than it is worth here; the
# content fix (state the trigger in the user's words) is the likely one.
# Wins 2026-08-08: /explanations/range-fetched-model/ (expected #2).
expect = ["/how-to/reindex-in-ci/"]
kind = "paraphrase"

[[query]]
q = "does typing in the box send anything to a server"
# CORPUS GAP, not an engine issue. The sentence that answers this ("no
# search server, no API key, no request leaves the page except range
# fetches against static files") lives in _index.md, which is skipped as a
# section page. Meanwhile getting-started contains both "box" ("a working
# search box") and "server" ("not the dev server"), so BM25 has two real
# matches for a question it does not answer. This is the gap
# reference/indexing-rules documents under "Documented gaps", found by the
# corpus's own eval. Resolve deliberately: move the privacy claim onto
# range-fetched-model.md because the docs are better for it, or delete
# this case. Do not move it merely to turn the case green.
# Wins 2026-08-08: /tutorials/getting-started/, neither expected page top 3.
expect = ["/explanations/range-fetched-model/", "/reference/browser-runtime/"]
kind = "paraphrase"

[[query]]
q = "see why one result beat another"
# FIXTURE, probably: queries-toml's scoring section is about reading
# recall numbers and per-kind breakdowns, which is "see why the SET scored
# what it did" rather than "see why one result beat another". The
# distinction is real but fine, and a reader landing on queries-toml would
# not feel badly served. Parked here rather than in the gate until that is
# decided: either add queries-toml to `expect` and accept a softer case,
# or keep it strict as an ordering failure for the `query` command's own
# documentation. Wins 2026-08-08: /reference/queries-toml/ (expected #2, #3).
expect = ["/explanations/hybrid-ranking/", "/tutorials/evaluate-your-search/", "/reference/cli/"]
kind = "paraphrase"
