# Gate fixture for the chops-search docs corpus (19 docs). Runs at default
# scoring (min_cos derived, chunk_penalty 0.02) with --fail-under 0.85.
#
# This file is the contract the engine meets TODAY. Aspirational cases and
# reproductions of open engine issues live in fixtures/known-failures.toml,
# annotated with their diagnoses; they run manually / non-gating. When an
# engine fix lands, promote its case back here in the same PR.
#
# Corpus notes that shape this fixture: topics deliberately span a how-to
# and a reference page, so `expect` lists every page that legitimately
# answers. The docs also QUOTE their own example queries ("sourdough
# starter hydration" appears verbatim in two pages), so negatives were
# checked word-by-word against the corpus.

# ---------------------------------------------------------------- exact
[[query]]
q = "wasm-unsafe-eval"
expect = ["/how-to/deploy-with-caching/", "/how-to/site-wide-search/"]
kind = "exact"

[[query]]
q = "model lockfile"
expect = ["/how-to/manage-the-model/", "/how-to/reindex-in-ci/", "/tutorials/getting-started/"]
kind = "exact"

[[query]]
q = "reciprocal rank fusion"
# Also appears inside queries-toml's example block; both are honest answers.
expect = ["/explanations/hybrid-ranking/", "/reference/queries-toml/"]
kind = "exact"

[[query]]
q = "tag_weight"
expect = ["/reference/configuration/", "/explanations/hybrid-ranking/"]
kind = "exact"

[[query]]
q = "Content-Range"
expect = ["/explanations/designed-degradation/"]
kind = "exact"

[[query]]
q = "prefix_rows"
# The artifacts page says both halves of the split token more often than
# the configuration page, and it is a legitimate answer.
expect = ["/reference/artifacts/", "/reference/configuration/", "/reference/cli/"]
kind = "exact"

[[query]]
q = "in_search_index"
expect = ["/reference/indexing-rules/"]
kind = "exact"

# ----------------------------------------------------------- paraphrase
[[query]]
q = "works locally but broken after deploying"
expect = ["/how-to/deploy-with-caching/", "/explanations/designed-degradation/"]
kind = "paraphrase"

[[query]]
q = "make the dialog match my site's colors"
expect = ["/reference/browser-runtime/", "/how-to/site-wide-search/", "/how-to/use-your-themes-search-ui/"]
kind = "paraphrase"

[[query]]
q = "how much do visitors have to download"
expect = ["/explanations/range-fetched-model/", "/how-to/deploy-with-caching/"]
kind = "paraphrase"

[[query]]
q = "nonsense queries come back with junk results"
expect = ["/explanations/hybrid-ranking/", "/reference/queries-toml/", "/tutorials/evaluate-your-search/"]
kind = "paraphrase"

[[query]]
q = "rebuild automatically when i publish a post"
expect = ["/how-to/reindex-in-ci/"]
kind = "paraphrase"

[[query]]
q = "prove a change didn't make results worse"
# Judgment call, recorded: designed-degradation's closing section is
# genuinely about regression-testability of the loading path ("a bug shows
# up as a recall drop"), so it is a defensible answer, not a padded one.
# If that reasoning stops holding after edits to that page, demote this
# case rather than re-padding it.
expect = ["/tutorials/evaluate-your-search/", "/how-to/reindex-in-ci/", "/explanations/designed-degradation/"]
kind = "paraphrase"

# --------------------------------------------------------- navigational
[[query]]
q = "install"
expect = ["/how-to/install/", "/tutorials/getting-started/"]
kind = "navigational"

[[query]]
q = "queries.toml"
expect = ["/reference/queries-toml/", "/tutorials/evaluate-your-search/"]
kind = "navigational"

# ----------------------------------------------------- negative control
# Checked word-by-word against the corpus. NOT usable here: "sourdough"
# (quoted as an example in two pages); "patterns"/"plan"/"budget" appear in
# prose. A second negative lives in known-failures.toml until the floor
# calibration and prefix-as-sole-evidence issues land.
[[query]]
q = "espresso grinder burrs"
expect = []
kind = "negative"

[[query]]
q = "data-chops-open"
# ISSUE: compound tokenization. Hyphenated identifiers split into parts;
# "chops" is a corpus-wide stopword (df 19/19), so ranking is noise-driven.
# Fix: index hyphen/underscore compounds as both parts AND whole token.
expect = ["/how-to/site-wide-search/", "/reference/browser-runtime/"]
kind = "exact"

[[query]]
q = "getting started"
# ISSUE: title weight vs BM25 length normalisation. A short page that
# mentions the phrase outranks the page titled with it. Candidate fix:
# title_weight default, or tags on docs pages. Also flips with
# title_weight = 4 (content-side change, not an engine fix).
expect = ["/tutorials/getting-started/"]
kind = "navigational"

[[query]]
q = "cli"
# ISSUE: same title-weight/length-norm interaction as "getting started".
expect = ["/reference/cli/"]
kind = "navigational"

[[query]]
q = "a page i wrote never shows up"
# ASPIRATIONAL: maximally colloquial symptom phrasing with almost no
# content words. Docs-side fix available too: indexing-rules could open
# with the symptom in the user's vocabulary.
expect = ["/reference/indexing-rules/", "/tutorials/evaluate-your-search/"]
kind = "paraphrase"

[[query]]
q = "stopped understanding meaning, only matches literal words now"
# ASPIRATIONAL: symptom-language paraphrase for keyword-only degradation.
# Docs-side fix available: designed-degradation could state the symptom
# as a visitor experiences it.
expect = ["/explanations/designed-degradation/", "/reference/browser-runtime/"]
kind = "paraphrase"

[[query]]
q = "shrink vectors to save bandwidth"
# ISSUE: fenced-code keyword pollution. reindex-in-ci wins on the term
# frequency of "Save"/"save" inside its YAML step names. Fix: code_weight
# (< 1) for fenced-block content, like title_weight but downward.
expect = ["/how-to/manage-the-model/", "/reference/configuration/", "/explanations/range-fetched-model/"]
kind = "paraphrase"

[[query]]
q = "toddler bedtime routine"
# ISSUE(S): floor calibration (noise cosines clear the derived floor at
# dims=128) and prefix-as-sole-evidence ("routine" prefix-matches
# "routinely" in site-wide-search and surfaces a result on that alone).
expect = []
kind = "negative"

