# ----------------------------------------------------- negative control
# No document answers this. The correct behavior is an EMPTY result list
# once a relevance floor exists; today every doc is returned in noise
# order, which is why `expect = []` currently fails by design.
[[query]]
q = "sourdough starter hydration"
expect = []
kind = "negative"

[[query]]
