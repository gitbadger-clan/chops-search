[package]
name = "chops-search"
description = "Build tool for chops-search: turns a Zola content tree and a model2vec model into static search artifacts."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# Lib target exists so integration tests (the model2vec-rs parity oracle)
# can reach the model loader; the binary stays thin over it.
[lib]
name = "chops_search"
path = "src/lib.rs"

[[bin]]
name = "chops-search"
path = "src/main.rs"

[dependencies]
chops-search-core = { path = "../chops-search-core", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# tokenizer.json parsing only — never enters the wasm build.
serde_json = "1"
# model2vec ships model.safetensors; this crate is pure and small.
safetensors = "0.8"
# PCA for --dims (256×256 symmetric eigendecomposition at build time).
# CLI-only: never appears in chops-search-core or the wasm dependency tree.
nalgebra = "0.35"

# Real front-matter parsing — CLI-only, never enters the wasm tree.
toml = "1.1"
# Zola-style path slugification (shares the crate chops-search-core already uses).
unicode-normalization = "0.1"

# Raw HF tokenizer as a parity oracle, alongside model2vec-rs. Already in
# the tree transitively; declared here so tests can compare exact token
# ids instead of embedding cosines. Align the version with what
# model2vec-rs pulls (`cargo tree -p chops-search | grep tokenizers`) so the
# build doesn't carry two copies.
tokenizers = "0.23"

# gzip for the eager artifacts. CLI-only — the browser decompresses with
# the platform's DecompressionStream, so nothing enters the wasm tree.
flate2 = "1"

sha2 = "0.11"

# HTTP for `model fetch` only. `build` never touches the network — that
# invariant is about the build, not about the binary. ureq over reqwest:
# blocking, no async runtime, rustls rather than a system OpenSSL.
ureq = "3"

[dev-dependencies]
# Official MinishLab implementation, used ONLY as a parity oracle in
# tests/model2vec_parity.rs — never as the production embedding path.
# The browser must run chops-search-core's tokenizer, so build time must too;
# one implementation, compiled twice, is the invariant. This dep exists
# to prove that implementation matches the reference.
# (Pulls the HF `tokenizers` crate; that's fine in dev-deps, and exactly
# why it can't be a real dependency: it would dwarf the wasm blob.)
model2vec-rs = "0.2"
