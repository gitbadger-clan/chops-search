[package]
name = "chops-search-core"
description = "Hybrid keyword + semantic search engine for static sites: WordPiece, int8 row store, BM25, RRF. Compiles to native and wasm unchanged."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
# NFD decomposition + combining-mark detection for BERT-style accent
# stripping (strip_accents inherits from lowercase=true in the potion
# tokenizer config). Pure Rust, no_std-capable, compiles to wasm.
# Costs some tens of KB of tables in the wasm blob; if that ever hurts,
# replace normalize() with a Latin-1/Latin-Ext-A fold table and accept
# drift on non-Latin scripts.
unicode-normalization = "0.1"
