[package]
name = "chops-search-wasm"
version = "0.2.3"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chops-search-core = { path = "../chops-search-core" }
wasm-bindgen = "0.2"

# No web-sys, no wasm-bindgen-futures, no fetch from Rust. HTTP calls
# aren't where the correctness risk lives; the tokenizer is. JS is the
# dumb byte pump.
